<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Image Encryptor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* Custom styles for file input */
        .file-input-label {
            display: block;
            padding: 0.75rem 1rem;
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }

        .file-input-label:hover {
            border-color: #4f46e5;
            background-color: #eef2ff;
        }

        .file-input-label.has-file {
            border-color: #16a34a;
            background-color: #f0fdf4;
        }

        /* Loading spinner animation */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }

        /* Notification toast animation */
        .toast {
            animation: slide-in 0.5s forwards, fade-out 0.5s 4.5s forwards;
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 50;
        }
        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes fade-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">Secure Image Encryptor</h1>
            <p class="text-lg text-gray-600 mt-2">Encrypt and decrypt images directly in your browser using AES-GCM.</p>
        </header>
        
        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Encryption Card -->
            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">Encrypt Image</h2>
                <form id="encForm">
                    <div class="space-y-4">
                        <div>
                            <label for="encFile" class="file-input-label" id="encFileLabel">
                                <span class="text-gray-500" id="encFileText">Click to select an image</span>
                            </label>
                            <input type="file" name="file" id="encFile" class="hidden" accept="image/*" required>
                        </div>
                        <div>
                            <label for="encPass" class="sr-only">Password</label>
                            <input type="password" name="password" id="encPass" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Enter a strong password" required>
                        </div>
                    </div>
                    <button type="submit" id="encButton" class="mt-6 w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform transform hover:scale-105 flex items-center justify-center">
                        <span id="encButtonText">Encrypt & Download</span>
                        <div id="encSpinner" class="hidden spinner w-5 h-5 border-t-2 border-r-2 border-white rounded-full ml-2"></div>
                    </button>
                </form>
            </div>

            <!-- Decryption Card -->
            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">Decrypt Image</h2>
                <form id="decForm">
                     <div class="space-y-4">
                        <div>
                           <label for="decFile" class="file-input-label" id="decFileLabel">
                                <span class="text-gray-500" id="decFileText">Click to select a .enc file</span>
                           </label>
                           <input type="file" name="file" id="decFile" class="hidden" accept=".enc" required>
                        </div>
                        <div>
                           <label for="decPass" class="sr-only">Password</label>
                           <input type="password" name="password" id="decPass" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Enter the password" required>
                        </div>
                    </div>
                    <button type="submit" id="decButton" class="mt-6 w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-transform transform hover:scale-105 flex items-center justify-center">
                        <span id="decButtonText">Decrypt & Preview</span>
                        <div id="decSpinner" class="hidden spinner w-5 h-5 border-t-2 border-r-2 border-white rounded-full ml-2"></div>
                    </button>
                </form>
                <div id="previewWrapper" class="mt-6 hidden">
                    <h3 class="font-semibold text-lg mb-2">Decrypted Image:</h3>
                    <div id="preview" class="p-4 border border-gray-200 rounded-lg bg-gray-50">
                        <img id="previewImg" src="" alt="Decrypted Image" class="max-w-full h-auto rounded-md mx-auto shadow-sm">
                        <a id="downloadLink" href="#" download="decrypted_image.png" class="block text-center mt-4 text-indigo-600 hover:text-indigo-800 font-semibold">Download Decrypted Image</a>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="text-center mt-12 text-gray-500">
            <p>&copy; 2025 Secure Encryptor. All operations are performed locally in your browser.</p>
        </footer>

    </div>
    
    <!-- Notification Toast -->
    <div id="notification" class="hidden toast max-w-xs p-4 bg-gray-800 text-white rounded-lg shadow-lg">
        <p id="notification-message"></p>
    </div>

    <script>
        // DOM element references
        const encForm = document.getElementById('encForm');
        const decForm = document.getElementById('decForm');
        const encFileInput = document.getElementById('encFile');
        const decFileInput = document.getElementById('decFile');
        const encFileLabel = document.getElementById('encFileLabel');
        const decFileLabel = document.getElementById('decFileLabel');
        const encFileText = document.getElementById('encFileText');
        const decFileText = document.getElementById('decFileText');
        const encPassInput = document.getElementById('encPass');
        const decPassInput = document.getElementById('decPass');
        const previewWrapper = document.getElementById('previewWrapper');
        const previewImg = document.getElementById('previewImg');
        const downloadLink = document.getElementById('downloadLink');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');

        const encButton = document.getElementById('encButton');
        const encButtonText = document.getElementById('encButtonText');
        const encSpinner = document.getElementById('encSpinner');
        const decButton = document.getElementById('decButton');
        const decButtonText = document.getElementById('decButtonText');
        const decSpinner = document.getElementById('decSpinner');
        

        // --- UTILITY FUNCTIONS ---

        /**
         * Shows a notification toast.
         * @param {string} message - The message to display.
         * @param {boolean} [isError=false] - If true, displays an error style.
         */
        function showNotification(message, isError = false) {
            notificationMessage.textContent = message;
            notification.className = `toast max-w-xs p-4 text-white rounded-lg shadow-lg ${isError ? 'bg-red-600' : 'bg-gray-800'}`;
            notification.classList.remove('hidden');
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 5000);
        }

        /**
         * Derives a cryptographic key from a password and salt using PBKDF2.
         * @param {string} password - The user's password.
         * @param {Uint8Array} salt - A random salt.
         * @returns {Promise<CryptoKey>} - The derived cryptographic key.
         */
        async function getKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                enc.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveKey']
            );
            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                true,
                ['encrypt', 'decrypt']
            );
        }
        
        /**
         * Triggers a browser download for a given Blob.
         * @param {Blob} blob - The Blob to download.
         * @param {string} filename - The desired filename for the download.
         */
        function triggerDownload(blob, filename) {
             const a = document.createElement('a');
             a.href = URL.createObjectURL(blob);
             a.download = filename;
             document.body.appendChild(a);
             a.click();
             document.body.removeChild(a);
             URL.revokeObjectURL(a.href);
        }

        /**
         * Toggles the loading state for a button.
         * @param {string} type - 'enc' for encrypt, 'dec' for decrypt.
         * @param {boolean} isLoading - The loading state.
         */
        function setLoading(type, isLoading) {
            const button = type === 'enc' ? encButton : decButton;
            const buttonText = type === 'enc' ? encButtonText : decButtonText;
            const spinner = type === 'enc' ? encSpinner : decSpinner;

            if (isLoading) {
                button.disabled = true;
                buttonText.textContent = type === 'enc' ? 'Encrypting...' : 'Decrypting...';
                spinner.classList.remove('hidden');
            } else {
                button.disabled = false;
                buttonText.textContent = type === 'enc' ? 'Encrypt & Download' : 'Decrypt & Preview';
                spinner.classList.add('hidden');
            }
        }
        
        
        // --- EVENT LISTENERS ---

        // Update file input label with filename
        encFileInput.addEventListener('change', () => {
             if (encFileInput.files.length > 0) {
                 encFileText.textContent = encFileInput.files[0].name;
                 encFileLabel.classList.add('has-file');
             } else {
                 encFileText.textContent = 'Click to select an image';
                 encFileLabel.classList.remove('has-file');
             }
        });

        decFileInput.addEventListener('change', () => {
             if (decFileInput.files.length > 0) {
                 decFileText.textContent = decFileInput.files[0].name;
                 decFileLabel.classList.add('has-file');
             } else {
                 decFileText.textContent = 'Click to select a .enc file';
                 decFileLabel.classList.remove('has-file');
             }
        });
        
        // Handle Encryption
        encForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = encFileInput.files[0];
            const password = encPassInput.value;

            if (!file || !password) {
                showNotification('Please select a file and enter a password.', true);
                return;
            }
            
            setLoading('enc', true);
            previewWrapper.classList.add('hidden');

            try {
                const fileBuffer = await file.arrayBuffer();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await getKey(password, salt);

                const encryptedContent = await crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    fileBuffer
                );

                // Structure of the encrypted file: [salt][iv][encrypted_data]
                const encryptedBlob = new Blob([salt, iv, new Uint8Array(encryptedContent)]);
                const originalFilename = file.name.split('.').slice(0, -1).join('.');
                
                triggerDownload(encryptedBlob, `${originalFilename}.enc`);
                showNotification('File encrypted successfully!');
                encForm.reset();
                encFileText.textContent = 'Click to select an image';
                encFileLabel.classList.remove('has-file');

            } catch (error) {
                console.error('Encryption failed:', error);
                showNotification('Encryption failed. Please try again.', true);
            } finally {
                setLoading('enc', false);
            }
        });

        // Handle Decryption
        decForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = decFileInput.files[0];
            const password = decPassInput.value;

            if (!file || !password) {
                showNotification('Please select a file and enter a password.', true);
                return;
            }

            setLoading('dec', true);
            previewWrapper.classList.add('hidden');

            try {
                const fileBuffer = await file.arrayBuffer();
                
                // Extract salt, IV, and ciphertext from the file buffer
                const salt = fileBuffer.slice(0, 16);
                const iv = fileBuffer.slice(16, 28); // 16 + 12
                const data = fileBuffer.slice(28);

                const key = await getKey(password, new Uint8Array(salt));

                const decryptedContent = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: new Uint8Array(iv) },
                    key,
                    data
                );

                const blob = new Blob([decryptedContent]);
                const objectURL = URL.createObjectURL(blob);
                
                previewImg.src = objectURL;
                previewImg.onload = () => { URL.revokeObjectURL(objectURL); }; // Clean up memory
                
                const originalFilename = file.name.replace(/\.enc$/, '');
                downloadLink.download = `decrypted_${originalFilename}`;
                downloadLink.href = URL.createObjectURL(blob);
                
                previewWrapper.classList.remove('hidden');
                showNotification('File decrypted successfully!');

            } catch (error) {
                console.error('Decryption failed:', error);
                showNotification('Decryption failed. Incorrect password or corrupted file.', true);
            } finally {
                setLoading('dec', false);
            }
        });
    </script>
</body>

</html>
